name = "hiddenfeeai-worker"
compatibility_date = "2025-01-24"
main = "./src/index.ts"

[placement]
mode = "smart"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "ANALYSIS_KV"
id = "b95e8f2318604b699721214937bdf6ad"
preview_id = "b95e8f2318604b699721214937bdf6ad"

[vars]
ENVIRONMENT = "production"
MAX_UPLOAD_SIZE_MB = "25"
FRONTEND_URL = "https://hiddenfeeai.com"
VITE_API_URL = "https://hiddenfeeai-worker.mr-richardthomasg888.workers.dev"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"
DEEPSEEK_REASONER_MODEL = "deepseek-reasoner"
STRIPE_PRICE_USD_CENTS = "1500"
TEST_MODE_SKIP_PAYMENT = "false"
USE_NEW_PIPELINE = "false"
USE_V2_PIPELINE = "true"
# ── IBM Docling Service Endpoint ──
# PERMANENT Cloudflare Named Tunnel — survives restarts, zero cost.
# Setup: see hiddenfee-doc-engine/cloudflared-tunnel.yml
# After creating the tunnel, set the URL via secret:
#   npx wrangler secret put DOCLING_SERVICE_URL
#   Enter: https://hiddenfee-doc-engine.hiddenfeeai.com
# NEVER use: localhost, 127.0.0.1, or trycloudflare.com (temporary tunnels)
DOCLING_SERVICE_URL = "https://hiddenfee-doc-engine.hiddenfeeai.com"

[env.dev]
vars = { ENVIRONMENT = "development", FRONTEND_URL = "https://hiddenfeeai.com", TEST_MODE_SKIP_PAYMENT = "false", USE_NEW_PIPELINE = "true", USE_V2_PIPELINE = "false", DOCLING_SERVICE_URL = "http://localhost:8000" }


# Secrets (set via `npx wrangler secret put`)
# DEEPSEEK_API_KEY
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET