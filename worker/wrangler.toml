name = "hiddenfeeai-worker"
compatibility_date = "2025-01-24"
main = "./src/index.ts"

[placement]
mode = "smart"

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "production"
MAX_UPLOAD_SIZE_MB = "25"
FRONTEND_URL = "https://hiddenfeeai.com"
VITE_API_URL = "https://hiddenfeeai-worker.mr-richardthomasg888.workers.dev"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"
DEEPSEEK_REASONER_MODEL = "deepseek-reasoner"
STRIPE_PRICE_USD_CENTS = "1500"
TEST_MODE_SKIP_PAYMENT = "false"

[env.dev]
vars = { ENVIRONMENT = "development", FRONTEND_URL = "https://hiddenfeeai.com", TEST_MODE_SKIP_PAYMENT = "false" }

[env.production]
vars = { ENVIRONMENT = "production", FRONTEND_URL = "https://hiddenfeeai.com", TEST_MODE_SKIP_PAYMENT = "false" }

# Secrets (set via `npx wrangler secret put`)
# DEEPSEEK_API_KEY
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET